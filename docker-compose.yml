services:
  db:
    image: postgres:16
    env_file:
      - ${DB_ENV_FILE:-./backend/.env}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed_subjects &&
      python manage.py seed_chat_groups &&
      python manage.py seed_payment_requisites &&
      python manage.py runserver 0.0.0.0:8000
      "
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./infra/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certbot/www:/var/www/certbot
      - ./infra/certbot/conf:/etc/letsencrypt

volumes:
  postgres_data:
